version: '3.8'
services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    restart: always

  backend:
    image: hsjadeja/my-node-backend:latest
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  frontend:
    image: hsjadeja/my-react-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
